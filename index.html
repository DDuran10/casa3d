<style>
:root{--bg:#eef0ec;--panel:#f9faf7;--line:#d5d9d0;--ink:#1c2330;--muted:#5f6876;--accent:#2d55c8;--accent-ink:#fff;--warn:#b4372c;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#13161b;--panel:#1a1e24;--line:#2c323b;--ink:#e6e9ee;--muted:#9aa3b0;--accent:#7f9cff;--accent-ink:#0f1320;--warn:#ff8a7a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
img{width:64px;height:64px;border-radius:14px}
h1{margin:0;font-size:20px}
p{margin:0;color:var(--muted)}
label{font-size:13px;color:var(--muted)}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
button{font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:46px}
button:disabled{opacity:.6}
#err{color:var(--warn);min-height:1.2em;font-size:14px}
</style>

const KEY = 'casa3d.key.v1';
// En la app Android el contenido va dentro del APK, pero la app descarga las versiones nuevas
// (casa3d.payload.v1) y usa la más reciente: así se actualiza sin reinstalar.
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const PAY = (() => { if (!NATIVE) return P; try { const c = JSON.parse(localStorage.getItem('casa3d.payload.v1') || 'null'); if (c && c.data && (c.t || 0) > (P.t || 0)) return c; } catch {} return P; })();
window.__casaPayloadT = PAY.t || 0;
const u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), err = document.getElementById('err');

async function open(key) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(PAY.iv) }, key, u8(PAY.data));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
async function fromSaved() {
  let raw = null; try { raw = localStorage.getItem(KEY); } catch {}
  if (!raw) return false;
  try { const key = await crypto.subtle.importKey('raw', u8(raw), 'AES-GCM', false, ['decrypt']); await open(key); return true; }
  catch { try { localStorage.removeItem(KEY); } catch {} return false; }
}
f.addEventListener('submit', async e => {
  e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Abriendo…';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(PAY.salt), iterations: PAY.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);

    if (document.getElementById('rem').checked) { try { localStorage.setItem(KEY, b64(await crypto.subtle.exportKey('raw', key))); } catch {} }
    await open(key);

    err.textContent = 'Contraseña incorrecta. Revisa mayúsculas y espacios.';
    go.disabled = false; go.textContent = 'Entrar'; pw.select();

});
if (!window.isSecureContext || !crypto.subtle) { f.hidden = false; err.textContent = 'Abre la app desde su dirección https para poder entrar.'; go.disabled = true; }
